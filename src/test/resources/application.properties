spring.application.name=strollsplash-test

# STORAGE CONFIG
storage.endpoint=
storage.region=us-east-1
storage.access-key-id=test-access-key
storage.secret-access-key=test-secret-key
storage.bucket-name=test-bucket
storage.public-url=https://cdn.test

# SPLASH CONFIG
splash.admin-key=test-key
splash.cache.ttl=2m
splash.http.max-age=5m

# FILE UPLOAD LIMITS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true
