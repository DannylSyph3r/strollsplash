spring.application.name=strollsplash
server.port=${PORT:8080}

# DATABASE CONFIG
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# STORAGE CONFIG (Cloudflare R2 or AWS S3)
# Empty defaults on the required values so a missing one fails
storage.endpoint=${STORAGE_ENDPOINT:}
storage.region=${STORAGE_REGION:us-east-1}
storage.access-key-id=${STORAGE_ACCESS_KEY_ID:}
storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:}
storage.bucket-name=${STORAGE_BUCKET_NAME:}
storage.public-url=${STORAGE_PUBLIC_URL:}

# SPLASH CONFIG
# Empty default so a missing key fails
splash.admin-key=${ADMIN_API_KEY:}
splash.cache.ttl=5m
splash.http.max-age=5m
splash.upload.max-per-minute=${SPLASH_UPLOAD_MAX_PER_MINUTE:10}

# FILE UPLOAD LIMITS
spring.servlet.multipart.max-file-size=${SPLASH_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPLASH_UPLOAD_MAX_SIZE:10MB}
spring.servlet.multipart.resolve-lazily=true

# JSON
spring.jackson.deserialization.fail-on-unknown-properties=true

# LOGGING
logging.level.dev.slethware.strollsplash=${LOG_LEVEL_APP:INFO}

# SWAGGER DOCS CONFIG
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.version=openapi_3_0
